  <title>Getting started with Stillwell</title>
  <script type="text/markdown">
    # Getting started with Stillwell

    [Stillwell](https://openwatersio.github.io/stillwell/) is a set of Parquet and JSON files at `https://stillwell.openwaters.io/`, with measured water levels from national and regional agencies in one format. This notebook queries them from your browser with [DuckDB-WASM](https://duckdb.org/docs/api/wasm/overview), without an account and without downloading the whole store. It follows the site's [Getting started](https://openwatersio.github.io/stillwell/docs/getting-started/) guide.

    It follows one station, Hoek van Holland at the mouth of the Port of Rotterdam, from finding it to comparing this year's water with the last ten.
  </script>
  <script type="text/markdown">
    ## Set up DuckDB

    The SQL cells in this notebook run against a DuckDB client named `db`. Observable's `DuckDBClient` downloads whole files by default, so this one turns on ranged reads: DuckDB then fetches only the columns and parts of a file a query needs. Results come back as [Apache Arrow](https://arrow.apache.org/docs/js/) tables. Times in them are milliseconds since 1970, UTC; Plot reads them as dates, and `new Date(t)` turns one into a JavaScript `Date`. Setting the session to UTC makes DuckDB group them by UTC day and month.
  </script>
  <script type="module" pinned>
    const db = await DuckDBClient.of({}, {filesystem: {forceFullHTTPReads: false}});
    await db.query("SET GLOBAL TimeZone = 'UTC'");

    // Shows a result as a table, with years written without a thousands separator.
    const table = (data) => Inputs.table(data, {format: {year: String, first: String, last: String}});
  </script>
  <script type="text/markdown">
    ## Find a station

    Every station is a row in `stations.parquet`. Search it by name:
  </script>
  <script type="module">
    const name = view(Inputs.text({label: "Name", value: "hoek van holland", submit: true}));
  </script>
  <script type="module">
    table(found)
  </script>
  <script type="application/sql" database="var:db" output="found" hidden pinned>
    SELECT id, name, products, year(first) AS first, year(last) AS last
    FROM 'https://stillwell.openwaters.io/stations.parquet'
    WHERE name ILIKE ${`%${name}%`} AND id = preferred
    ORDER BY id
  </script>
  <script type="text/markdown">
    - `id` names the station everywhere in the store. It's the source's ID, then the station's ID within it: `rws/hoekvanholland` is Rijkswaterstaat's Hoek van Holland gauge.
    - `id = preferred` keeps one station from each group of linked stations. Several sources can publish the same gauge, and GESLA also has a copy of Hoek van Holland's record. `preferred` names the one to read for its measured levels; [Stations](https://openwatersio.github.io/stillwell/docs/guides/stations/) explains how it's chosen. Leave the filter out to see every copy.
    - `products` lists what the station has: measured `levels`, measured high and low waters (`extremes`), and the source's tide `predictions` and `predicted_extremes`.
    - `first` and `last` bound its record.

    The <code>$\{…}</code> in the SQL cell passes the text box's value to DuckDB as a parameter, so the query runs again when you search.

    Or find the stations nearest a point. This orders them by an approximate distance in kilometers, which is close enough over a few tens of kilometers:
  </script>
  <script type="application/sql" database="var:db" output="nearest" pinned>
    SELECT id, name, kind, status, lat, lon,
      round(111.2 * sqrt((lat - 51.98) ^ 2 + ((lon - 4.12) * cos(radians(51.98))) ^ 2), 1) AS km
    FROM 'https://stillwell.openwaters.io/stations.parquet'
    WHERE id = preferred
    ORDER BY km LIMIT 5
  </script>
  <script type="text/markdown">
    [`stations.parquet`](https://openwatersio.github.io/stillwell/docs/reference/stations/) has much more about each station: its datum and offsets to others, whether it's polled live, whether its levels carry a tide, and the terms its data comes under.

    ## See which years it has

    Measured levels are stored one file per station per year, and a year with no data has no file. The station's source has a years list, `stations/years/<source>.parquet`, with a row for each file and a count of its values by quality flag:
  </script>
  <script type="module">
    table(years)
  </script>
  <script type="application/sql" database="var:db" output="years" hidden pinned>
    SELECT year, hours, good, interpolated, preliminary, suspect + bad AS flagged
    FROM 'https://stillwell.openwaters.io/stations/years/rws.parquet'
    WHERE id = 'rws/hoekvanholland' AND year >= 2020
    ORDER BY year
  </script>
  <script type="module" pinned>
    Plot.plot({
      x: {label: null, tickFormat: "d", interval: 1},
      y: {label: "Values", grid: true},
      color: {legend: true, domain: ["good", "interpolated", "preliminary", "flagged"], range: ["#4c78a8", "#72b7b2", "#eeca3b", "#e45756"]},
      marks: [
        Plot.barY(
          Array.from(years).flatMap((d) => ["good", "interpolated", "preliminary", "flagged"].map((flag) => ({year: d.year, flag, n: d[flag]}))),
          {x: "year", y: "n", fill: "flag", order: ["good", "interpolated", "preliminary", "flagged"], tip: true}
        )
      ]
    })
  </script>
  <script type="text/markdown">
    `hours` counts the hours with at least one value, so a year of hourly or finer values with fewer than 8,760 (8,784 in a leap year) has gaps. **Good** values are ones the source has checked, **interpolated** ones it filled in, and **preliminary** ones it hasn't checked yet. Most recent data is preliminary. [Quality control](https://openwatersio.github.io/stillwell/docs/guides/quality-control/) explains each flag and which to keep.

    ## Read its levels

    A year's file is at `obs/<id>/<year>.parquet`. Read one year, leaving out values flagged suspect or bad:
  </script>
  <script type="application/sql" database="var:db" output="levels" pinned>
    SELECT time, level_m, flag, datum
    FROM 'https://stillwell.openwaters.io/obs/rws/hoekvanholland/2025.parquet'
    WHERE flag <= 2
    ORDER BY time
  </script>
  <script type="module" pinned>
    Plot.plot({
      width,
      height: 240,
      x: {label: null},
      y: {label: "Level (m, NAP)", grid: true},
      marks: [Plot.lineY(levels, {x: "time", y: "level_m", strokeWidth: 0.5})]
    })
  </script>
  <script type="text/markdown">
    That's ${levels.numRows.toLocaleString("en-US")} values, one every 10 minutes. These hold for every file in the store:

    - **Times are UTC.** DuckDB returns them as milliseconds since 1970. A `Date` made from one shows in your local time zone unless you format it in UTC, as with `toISOString()`.
    - **Levels are in meters**, measured from the datum named on each row. Hoek van Holland's is NAP, the Dutch national height system. [Refer them to another datum](#refer-levels-to-another-datum) below.
    - **`flag <= 2`** keeps every value not flagged suspect or bad, including preliminary ones. That's the right filter for most work.
    - **Select only the columns you need.** With ranged reads, DuckDB then fetches only those columns.

    To read several years, list their files and pass the list to `read_parquet`. The server can't list a folder, so a wildcard such as `obs/rws/hoekvanholland/*.parquet` doesn't work. Build the list from the years list instead, which also means you never ask for a year that doesn't exist:
  </script>
  <script type="module">
    table(fiveYears)
  </script>
  <script type="application/sql" database="var:db" output="fiveYears" hidden pinned>
    SET VARIABLE files = (
      SELECT list('https://stillwell.openwaters.io/obs/' || id || '/' || year || '.parquet' ORDER BY year)
      FROM 'https://stillwell.openwaters.io/stations/years/rws.parquet'
      WHERE id = 'rws/hoekvanholland' AND epoch = 1 AND year BETWEEN 2021 AND 2025
    );
    SELECT year(time) AS year, count(*) AS "values", round(avg(level_m), 3) AS mean_m,
      max(level_m) AS highest_m
    FROM read_parquet(getvariable('files'), union_by_name = true)
    WHERE flag <= 2
    GROUP BY ALL ORDER BY year
  </script>
  <script type="text/markdown">
    `epoch = 1` keeps to the station's main files. When a source moves a station's zero, its later years go to files of their own; [Building paths in code](#building-paths-in-code) covers that. `union_by_name = true` lets files written before a column was added read alongside newer ones.

    ## Do something with it

    ### Refer levels to another datum

    A station's `datums` column gives the meters to add to its levels to refer them to other datums, such as mean sea level (`MSL`) or the lowest astronomical tide (`LAT`) that charts measure depth from:
  </script>
  <script type="application/sql" database="var:db" output="inDatums" pinned>
    SELECT l.time, l.level_m AS nap_m,
      round(l.level_m + s.datums['MSL'], 3) AS msl_m,
      round(l.level_m + s.datums['LAT'], 3) AS lat_m
    FROM 'https://stillwell.openwaters.io/obs/rws/hoekvanholland/2025.parquet' l,
      'https://stillwell.openwaters.io/stations.parquet' s
    WHERE s.id = 'rws/hoekvanholland' AND l.flag <= 2
    ORDER BY l.time LIMIT 5
  </script>
  <script type="text/markdown">
    A level of ${inDatums.get(0).nap_m.toFixed(2)} m in NAP is ${inDatums.get(0).lat_m.toFixed(2)} m above LAT. [Datums](https://openwatersio.github.io/stillwell/docs/guides/datums/) explains where each offset comes from and how to convert a station whose zero has moved.

    Wherever you show a station's levels, show its `attribution`, and wherever you use its offsets, show `datums_attribution` too, the credits owed for them. For Hoek van Holland:
  </script>
  <script type="application/sql" database="var:db" output="credits" hidden pinned>
    SELECT attribution, datums_attribution
    FROM 'https://stillwell.openwaters.io/stations.parquet'
    WHERE id = 'rws/hoekvanholland'
  </script>
  <script type="text/markdown">
    ${[credits.get(0).attribution, ...(credits.get(0).datums_attribution ?? [])].filter(Boolean).map((c) => `- ${c}`).join("\n")}

    [Terms](https://openwatersio.github.io/stillwell/docs/guides/terms/) covers what each source asks for.

    ### Compare with the tide prediction

    Rijkswaterstaat also publishes its tide prediction for Hoek van Holland. The difference between what the gauge measured and what was predicted is mostly weather: wind and air pressure pushing the water up or holding it down. The days of 2025 with the largest surge:
  </script>
  <script type="application/sql" database="var:db" output="surgeDays" pinned>
    SELECT o.time::DATE AS day, max(o.level_m - p.level_m)::DECIMAL(4, 2) AS surge_m,
      max(o.level_m) AS highest_m
    FROM 'https://stillwell.openwaters.io/obs/rws/hoekvanholland/2025.parquet' o
    JOIN 'https://stillwell.openwaters.io/predictions/rws/hoekvanholland/2025.parquet' p USING (time)
    WHERE o.flag <= 2
    GROUP BY day ORDER BY surge_m DESC LIMIT 3
  </script>
  <script type="text/markdown">
    The measured and predicted levels over the three days around the largest surge:
  </script>
  <script type="application/sql" database="var:db" output="surge" hidden pinned>
    SELECT o.time, o.level_m AS measured_m, p.level_m AS predicted_m
    FROM 'https://stillwell.openwaters.io/obs/rws/hoekvanholland/2025.parquet' o
    JOIN 'https://stillwell.openwaters.io/predictions/rws/hoekvanholland/2025.parquet' p USING (time)
    WHERE o.flag <= 2 AND o.time BETWEEN ${new Date(surgeDays.get(0).day).toISOString()}::TIMESTAMPTZ - INTERVAL 1 DAY
      AND ${new Date(surgeDays.get(0).day).toISOString()}::TIMESTAMPTZ + INTERVAL 2 DAY
    ORDER BY o.time
  </script>
  <script type="module" pinned>
    Plot.plot({
      width,
      height: 260,
      x: {label: null},
      y: {label: "Level (m, NAP)", grid: true},
      color: {legend: true},
      marks: [
        Plot.lineY(surge, {x: "time", y: "measured_m", stroke: () => "Measured"}),
        Plot.lineY(surge, {x: "time", y: "predicted_m", stroke: () => "Predicted", strokeDasharray: "3,2"})
      ]
    })
  </script>
  <script type="text/markdown">
    The prediction and the measurements must share a datum to compare, as both do here. [Predictions](https://openwatersio.github.io/stillwell/docs/reference/predictions/) covers the predicted high and low waters too.

    ### Compare with earlier years

    This year's monthly mean water level against the same months over the ten years before:
  </script>
  <script type="application/sql" database="var:db" output="months" pinned>
    SET VARIABLE files = (
      SELECT list('https://stillwell.openwaters.io/obs/' || id || '/' || year || '.parquet' ORDER BY year)
      FROM 'https://stillwell.openwaters.io/stations/years/rws.parquet'
      WHERE id = 'rws/hoekvanholland' AND epoch = 1 AND year >= year(current_date) - 10
    );
    SELECT month(time) AS month,
      round(avg(level_m) FILTER (year(time) = year(current_date)), 3) AS this_year_m,
      round(avg(level_m) FILTER (year(time) < year(current_date)), 3) AS previous_10_years_m
    FROM read_parquet(getvariable('files'), union_by_name = true)
    WHERE flag <= 2
    GROUP BY ALL ORDER BY month
  </script>
  <script type="module" pinned>
    Plot.plot({
      x: {label: "Month", ticks: 12},
      y: {label: "Mean level (m, NAP)", grid: true},
      color: {legend: true},
      marks: [
        Plot.lineY(months, {x: "month", y: "previous_10_years_m", stroke: () => "Previous 10 years", marker: true}),
        Plot.lineY(months, {x: "month", y: "this_year_m", stroke: () => "This year", marker: true})
      ]
    })
  </script>
  <script type="text/markdown">
    The same pattern works for any station with a long record: change the `id` and the source's years list.

    ## Building paths in code

    A file's path is its product, the station's `id` and the year, as in `obs/rws/hoekvanholland/2025.parquet`. Two things to know when you build one:

    - **Station IDs need no encoding.** A `source_id` holds only letters, digits, `.`, `_`, `~` and `-`, so it goes into a path and a URL as it is.
    - **Datum epochs.** When a source moves a station to another reference, its later values go to files of their own, with the epoch's number after the station: `obs/<source>/<station>/2/<year>.parquet`. Most stations have one epoch and only the plain path. [Datum epochs](https://openwatersio.github.io/stillwell/docs/guides/datums/#datum-epochs) shows how to read across several.
  </script>
  <script type="module" pinned>
    function obsPath(id, year, epoch = 1) {
      return `https://stillwell.openwaters.io/obs/${id}/${epoch > 1 ? `${epoch}/` : ""}${year}.parquet`;
    }
  </script>
