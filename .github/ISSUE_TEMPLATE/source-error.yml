name: Source error
description: Something a source publishes is wrong
labels: [source-error]
body:
  - type: markdown
    attributes:
      value: |
        Tell us about values on the wrong clock or day, a gauge placed far from where it is, metadata that contradicts the data, or two endpoints that disagree. A maintainer who agrees records it as an erratum in the source's `errata.json` and closes this issue. See [CONTRIBUTING.md](https://github.com/openwatersio/water-levels/blob/main/CONTRIBUTING.md#source-errata).
  - type: textarea
    id: error
    attributes:
      label: What's wrong
      description: What the source publishes wrong.
    validations:
      required: true
  - type: textarea
    id: stations
    attributes:
      label: Stations
      description: The lake station IDs affected, one per line, such as `uhslc/329`, or the source's name if you don't know them.
    validations:
      required: true
  - type: input
    id: span
    attributes:
      label: Values affected
      description: The dates of the values that are wrong, if they're only some.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: How you found it, such as a comparison with another record or the source's own documentation.
    validations:
      required: true
