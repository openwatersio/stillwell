name: Monthly

# On the 2nd, refresh every source's station list, datums and terms, then
# rebuild stations.parquet and sources.json, and keep the scheduled workflows
# enabled. On the 9th, refetch every station's values that were still
# preliminary, from the earliest, so the ones the source has finalized since
# replace them. Ingest hourly starts a refresh of one source, at
# most once a day, when that source reports a station in another datum.
run-name: ${{ (inputs.refetch || github.event.schedule == '40 3 9 * *') && (inputs.sources && format('Refetch {0}', inputs.sources) || 'Refetch') || inputs.sources && format('Refresh {0}', inputs.sources) || 'Monthly' }}

# Each job waits in its source's group. GitHub keeps one job waiting per
# group and cancels it when a newer one arrives, so a job queued behind
# anything that outlasts the hour, a manual backfill or a long refresh, is
# cancelled by the next hourly run. Starting at 01:25 and 03:35, after that
# hour's run and compaction, the groups are usually free; rerun a cancelled
# job from Actions. The refetch runs on its own day for the same reason: queued
# behind the refreshes, it would be cancelled.
#
# The Worker in workers/cron dispatches both at those times, since GitHub's
# schedule runs late or not at all. The schedule, five minutes later, is a
# backup that plans nothing when a dispatched run on main of the same title,
# Monthly or Refetch for every source, started in the last day, so the
# refreshes don't run twice; rerun a cancelled job from Actions instead. A
# failed lookup runs the backup.
on:
  schedule:
    - cron: "30 1 2 * *"
    - cron: "40 3 9 * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources, separated by spaces (empty for every source)"
        required: false
        default: ""
      accept_epochs:
        description: "Pass --accept-epochs: open every datum change, after checking them"
        type: boolean
        default: false
      refetch:
        description: "Refetch preliminary values, instead of refreshing lists"
        type: boolean
        default: false

permissions: {}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
      refetch: ${{ steps.plan.outputs.refetch }}
    steps:
      # The sources come from each adapter's metadata (src/sources/jobs.ts).
      # The registry imports no packages (test/jobs.test.ts checks), so it
      # needs Node but not npm ci.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
      - id: plan
        run: |
          set -f
          # A re-run of every job is someone asking for this run, so it runs.
          if [ "$EVENT" = schedule ] && [ "$ATTEMPT" = 1 ]; then
            title=$([ "$REFETCH" = true ] && echo Refetch || echo Monthly)
            since=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
            if titles=$(gh run list --workflow monthly.yml --limit 100 --branch main --event workflow_dispatch --created ">=$since" --json displayTitle --jq '.[].displayTitle') && grep -qx "$title" <<< "$titles"; then
              echo "A dispatched $title run started in the last day"
              echo "sources=[]" >> "$GITHUB_OUTPUT"
              echo "refetch=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Every source, or those named; the refetch takes the ones whose
          # values become final (`finalizes` in their metadata), and fails
          # when none of those named does.
          if [ "$REFETCH" = true ]; then
            refetch=$(node scripts/sources.ts refetch $SOURCES)
            echo "sources=[]" >> "$GITHUB_OUTPUT"
            echo "refetch=$refetch" >> "$GITHUB_OUTPUT"
          else
            sources=$(node scripts/sources.ts lists $SOURCES)
            echo "sources=$sources" >> "$GITHUB_OUTPUT"
            echo "refetch=[]" >> "$GITHUB_OUTPUT"
          fi
        env:
          SOURCES: ${{ inputs.sources }}
          REFETCH: ${{ github.event.schedule == '40 3 9 * *' || inputs.refetch }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Each list in its source's group, the one every job that writes the source's
  # files or list shares, so a refresh that opens a datum epoch never lands
  # while a backfill, hourly, compaction or other refresh is writing that source.
  lists:
    needs: plan
    if: needs.plan.outputs.sources != '[]'
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    concurrency:
      group: lake-${{ matrix.source }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # CO-OPS's datums take up to 2 hours (refreshBudgetMs).
    timeout-minutes: 180
    # The environment holds the R2 credentials and only runs on main.
    environment: lake
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      # stations.parquet is rebuilt once, from every list, by the next job.
      - run: node scripts/ingest.ts stations "$SOURCE" --no-publish ${ACCEPT_EPOCHS:+--accept-epochs}
        env:
          SOURCE: ${{ matrix.source }}
          ACCEPT_EPOCHS: ${{ inputs.accept_epochs && 'yes' || '' }}
          WATER_LEVELS_LAKE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}

  # A source whose refresh failed kept its list, so the rest still publish.
  publish:
    needs: [plan, lists]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.sources != '[]' }}
    # The group the Ingest workflow's `publish` runs take.
    concurrency:
      group: lake
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: lake
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      - run: node scripts/ingest.ts publish
        env:
          WATER_LEVELS_LAKE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

  # Backfill takes every station whose bounds hold a preliminary value, active
  # or not, and fetches again from that value's month on, skipping ended years
  # with none (yearDone in src/backfill.ts), so values the source has finalized
  # since replace the ones compaction wrote. It then reads each station's
  # earliest preliminary value again into the bounds. Values preliminary from
  # before the cutoff, January three years back (REFETCH_YEARS in
  # src/lake/recent.ts), aren't fetched again, though their stations' later
  # years are; the run's page lists a station once its value falls behind it.
  # Backfill refuses bounds an older build wrote, without the column, until
  # `compact <source> --rebuild-bounds` from the Ingest workflow fills it in.
  refetch:
    needs: plan
    if: needs.plan.outputs.refetch != '[]'
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.refetch) }}
    concurrency:
      group: lake-${{ matrix.source }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: lake
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      # CO-OPS verifies a month a month or two after it ends, so most stations
      # start at last month or this one, a request a month at one a second; one
      # never verified is fetched from the cutoff on, 36 requests or more.
      # USGS approves months to years later, a year a request at one every 3.7
      # seconds, too many for one run across 11,000 stations, so each month
      # takes a twelfth of them, at most about 1,200 stations and up to three
      # years each, about 3.7 hours at most, and each station comes round once
      # a year; the current year is left to compaction. RWS and USACE ask a
      # year a request. Some USACE offices screen nothing, so their values stay
      # preliminary for good; --skip-unscreened leaves out a station with a
      # year of record and no value its source screened, but for January's run.
      # REFMAR's partner gauges often have only raw values, so it skips them the
      # same way.
      - run: |
          year=$(date -u +%Y)
          month=$(date -u +%m)
          case "$SOURCE" in
            usgs) set -- "$year" --shard "$((10#$month))/12" ;;
            # Every January takes them all, so a station whose office began
            # screening since, or a new epoch's, is read again and can rejoin.
            usace | refmar) set -- "$year-$month-01" $([ "$month" != 01 ] && echo --skip-unscreened) ;;
            *) set -- "$year-$month-01" ;;
          esac
          node scripts/ingest.ts backfill "$SOURCE" preliminary $((year - 3)) "$@"
        env:
          SOURCE: ${{ matrix.source }}
          WATER_LEVELS_LAKE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}

  # GitHub disables a public repo's scheduled workflows after 60 days without
  # a commit. Enabling a workflow through the API restarts that count, as the
  # keepalive-workflow action relies on, so this monthly call keeps every
  # schedule running, this one included, with no commits. One a maintainer
  # turned off stays off. It needs no lake credentials or concurrency group.
  # It runs on every run titled Monthly, scheduled or dispatched.
  keepalive:
    if: github.event.schedule == '30 1 2 * *' || (github.event_name == 'workflow_dispatch' && !inputs.sources && !inputs.refetch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: |
          # Monthly first, since it enables the rest; one failure doesn't stop the others.
          failed=0
          for workflow in monthly.yml ingest-hourly.yml compact-daily.yml bucket-check.yml canary.yml; do
            if ! state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq .state); then
              failed=1
            elif [ "$state" = disabled_manually ]; then
              echo "$workflow was turned off by hand; leaving it"
            elif ! gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"; then
              failed=1
            fi
          done
          exit "$failed"
        env:
          GH_TOKEN: ${{ github.token }}
