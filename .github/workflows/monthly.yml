name: Monthly

# On the 2nd, refresh every source's station list, datums and terms, then
# measure offsets between linked series, rebuild stations.parquet,
# sources.json and errata.json, report the
# cross-station checks, and keep the scheduled workflows enabled. On the 9th,
# refetch every station's values that were still
# preliminary, from the earliest, so the ones the source has finalized since
# replace them. Ingest hourly starts a refresh of one source, at
# most once a day, when that source reports a station in another datum.
run-name: ${{ (inputs.refetch || github.event.schedule == '40 3 9 * *') && (inputs.sources && format('Refetch {0}', inputs.sources) || 'Refetch') || inputs.sources && format('Refresh {0}', inputs.sources) || 'Monthly' }}

# Each job waits in its source's group. GitHub keeps one job waiting per
# group and cancels it when a newer one arrives, so a job queued behind
# anything that outlasts the hour, a manual backfill or a long refresh, is
# cancelled by the next hourly run. Starting at 01:25 and 03:35, after that
# hour's run and compaction, the groups are usually free; rerun a cancelled
# job from Actions. The refetch runs on its own day for the same reason: queued
# behind the refreshes, it would be cancelled.
#
# The Worker in workers/cron dispatches both at those times, since GitHub's
# schedule runs late or not at all. The schedule, five minutes later, is a
# backup that plans nothing when a dispatched run on main of the same title,
# Monthly or Refetch for every source, started in the last day, so the
# refreshes don't run twice; rerun a cancelled job from Actions instead. A
# failed lookup runs the backup.
on:
  schedule:
    - cron: "30 1 2 * *"
    - cron: "40 3 9 * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources, separated by spaces (empty for every source)"
        required: false
        default: ""
      accept_epochs:
        description: "Pass --accept-epochs: open every datum change, after checking them"
        type: boolean
        default: false
      accept_withheld:
        description: "Pass --accept-withheld: withhold more stations than the guard allows, after checking the rule"
        type: boolean
        default: false
      refetch:
        description: "Refetch preliminary values, instead of refreshing lists"
        type: boolean
        default: false

permissions: {}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
      refetch: ${{ steps.plan.outputs.refetch }}
    steps:
      # The sources come from each adapter's metadata (src/sources/jobs.ts).
      # The registry imports no packages (test/jobs.test.ts checks), so it
      # needs Node but not npm ci.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
      - id: plan
        run: |
          set -f
          # A re-run of every job is someone asking for this run, so it runs.
          if [ "$EVENT" = schedule ] && [ "$ATTEMPT" = 1 ]; then
            title=$([ "$REFETCH" = true ] && echo Refetch || echo Monthly)
            since=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
            if titles=$(gh run list --workflow monthly.yml --limit 100 --branch main --event workflow_dispatch --created ">=$since" --json displayTitle --jq '.[].displayTitle') && grep -qx "$title" <<< "$titles"; then
              echo "A dispatched $title run started in the last day"
              echo "sources=[]" >> "$GITHUB_OUTPUT"
              echo "refetch=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Every source, or those named; the refetch takes the ones whose
          # values become final (`finalizes` in their metadata), and fails
          # when none of those named does.
          if [ "$REFETCH" = true ]; then
            refetch=$(node scripts/sources.ts refetch $SOURCES)
            echo "sources=[]" >> "$GITHUB_OUTPUT"
            echo "refetch=$refetch" >> "$GITHUB_OUTPUT"
          else
            sources=$(node scripts/sources.ts lists $SOURCES)
            echo "sources=$sources" >> "$GITHUB_OUTPUT"
            echo "refetch=[]" >> "$GITHUB_OUTPUT"
          fi
        env:
          SOURCES: ${{ inputs.sources }}
          REFETCH: ${{ github.event.schedule == '40 3 9 * *' || inputs.refetch }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Each list in its source's group, the one every job that writes the source's
  # files or list shares, so a refresh that opens a datum epoch never lands
  # while a backfill, hourly, compaction or other refresh is writing that source.
  lists:
    needs: plan
    if: needs.plan.outputs.sources != '[]'
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    concurrency:
      group: store-${{ matrix.source }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # CO-OPS's datums take up to 2 hours (refreshBudgetMs), and analysis's
    # requalify as long as it has stations pending.
    timeout-minutes: 360
    # The environment holds the R2 credentials and only runs on main.
    environment: lake
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      # stations.parquet is rebuilt once, from every list, by the next job.
      - run: node scripts/ingest.ts stations "$SOURCE" --no-publish ${ACCEPT_EPOCHS:+--accept-epochs} ${ACCEPT_WITHHELD:+--accept-withheld}
        env:
          SOURCE: ${{ matrix.source }}
          ACCEPT_EPOCHS: ${{ inputs.accept_epochs && 'yes' || '' }}
          ACCEPT_WITHHELD: ${{ inputs.accept_withheld && 'yes' || '' }}
          STILLWELL_STORE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
      # The stations that are due judged from their levels in the store
      # (src/store/analysis.ts), after the list so new stations are judged too,
      # and in this job so it keeps the source's group, since a verdict that
      # changes a station's QC requalifies its stored years. It runs on the
      # list the store keeps when the refresh fails. A run stopped partway keeps
      # what it judged, and leaves the rest pending for the next.
      - if: ${{ !cancelled() }}
        run: node scripts/ingest.ts analyze "$SOURCE" --requalify --concurrency 8
        env:
          SOURCE: ${{ matrix.source }}
          STILLWELL_STORE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      # BSH publishes next year's predictions from about August. Each refresh
      # fetches this year's for every gauge, so a gauge added in the year, or a
      # month whose run failed, is filled by the next, and from August to December next year's
      # too. A year not yet published writes nothing, and one unchanged
      # rewrites no file. Nothing else fetches BSH, whose metadata is neither
      # hourly nor finalizes.
      - if: ${{ !cancelled() && matrix.source == 'bsh' }}
        run: |
          year=$(date -u +%Y)
          end=$((year + 1))
          if [ "$(date -u +%m)" -ge 08 ]; then end=$((year + 2)); fi
          node scripts/ingest.ts backfill bsh all "$year" "$end"
        env:
          STILLWELL_STORE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

  # Offsets between linked series of one gauge that share no reference datum,
  # measured from a year of their levels in the store (src/links.ts),
  # for publish to carry MSL, LAT and chart datum along. It reads levels and
  # writes only stations/links.parquet, which publish reads, so it needs no
  # source's group; a row the run doesn't replace is kept unless its pair was
  # read and didn't measure, and a failed read fails the job once the file is
  # written. Only
  # a full refresh runs it; a cancelled run skips it, and publish uses last
  # month's file. The links group keeps a hand-run Ingest `links` from writing
  # the file at the same time.
  links:
    needs: [plan, lists]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.sources != '[]' && !inputs.sources }}
    concurrency:
      group: links
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: lake
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      # Each of 8 holds a year of two series at most, minute values for PEGELONLINE.
      - run: node scripts/ingest.ts links --concurrency 8
        env:
          STILLWELL_STORE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

  # A source whose refresh or analysis failed kept its list and verdicts, so the rest still publish.
  # A list cancelled while it waits in its group cancels the run, so `always()`, not `!cancelled()`;
  # a run cancelled by hand still publishes the lists it wrote, which Compact daily would that night anyway.
  publish:
    needs: [plan, lists, links]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.sources != '[]' }}
    # The group every publish takes, Compact daily's and the Ingest workflow's.
    concurrency:
      group: store
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: lake
    permissions:
      contents: read
    steps:
      # The code from main as it is when this job starts, not when the run
      # started, so a source registered since isn't dropped from
      # stations.parquet. The job's steps and settings stay the run's. The
      # lists it reads may come from older code, as any night's publish does.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      - run: node scripts/ingest.ts publish
        env:
          STILLWELL_STORE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

  # Backfill takes every station whose bounds hold a preliminary value, active
  # or not (California DWR excepted, below), and fetches again from that value's month on, skipping ended years
  # with none (yearDone in src/backfill.ts), so values the source has finalized
  # since replace the ones compaction wrote. It then reads each station's
  # earliest preliminary value again into the bounds. Values preliminary from
  # before the cutoff, January three years back (REFETCH_YEARS in
  # src/store/recent.ts), aren't fetched again, though their stations' later
  # years are; the run's page lists a station once its value falls behind it.
  # Backfill refuses bounds an older build wrote, without the column, until
  # `compact <source> --rebuild-bounds` from the Ingest workflow fills it in.
  refetch:
    needs: plan
    if: needs.plan.outputs.refetch != '[]'
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.refetch) }}
    concurrency:
      group: store-${{ matrix.source }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: lake
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      # CO-OPS verifies a month a month or two after it ends, so most stations
      # start at last month or this one, a request a month at one a second; one
      # never verified is fetched from the cutoff on, 36 requests or more.
      # USGS approves months to years later, a year a request at one every 3.7
      # seconds, too many for one run across 11,000 stations, so each month
      # takes a twelfth of them, at most about 1,200 stations and up to three
      # years each, about 3.7 hours at most, and each station comes round once
      # a year; the current year is left to compaction. RWS and USACE ask a
      # year a request. Some USACE offices screen nothing, so their values stay
      # preliminary for good; --skip-unscreened leaves out a station with a
      # year of record and no value its source screened, but for January's run.
      # REFMAR's partner gauges often have only raw values, so it skips them the
      # same way. California DWR's files run days to months behind and nothing
      # else fetches them, so every active DWR station is read again from
      # January of last year to today, finished years included.
      - run: |
          year=$(date -u +%Y)
          month=$(date -u +%m)
          which=preliminary
          from=$((year - 3))
          case "$SOURCE" in
            usgs) set -- "$year" --shard "$((10#$month))/12" ;;
            dwr) which=all from=$((year - 1)) && set -- "$(date -u +%F)" --refetch ;;
            # Every January takes them all, so a station whose office began
            # screening since, or a new epoch's, is read again and can rejoin.
            usace | refmar) set -- "$year-$month-01" $([ "$month" != 01 ] && echo --skip-unscreened) ;;
            # JMA isn't hourly, so this is also what brings its new values: every
            # open station from two months back, whose final file is out by now,
            # to this month's provisional one.
            jma)
              # A station that fails doesn't keep the rest from their refetch.
              node scripts/ingest.ts backfill jma all "$(date -u -d "$year-$month-01 -2 months" +%F)" "$(date -u -d "$year-$month-01 +1 month" +%F)" || status=1
              set -- "$year-$month-01" ;;
            # BODC's months arrive late and in batches, sometimes two years
            # behind, and it fills gaps and reflags months it has published;
            # nothing else fetches them, so every station's last three years
            # are read again, finished ones included.
            bodc) which=all from=$((year - 2)) && set -- "$((year + 1))" --refetch ;;
            # CRMS's only source is CPRA's weekly export of the whole record,
            # read once a run and months behind, and CPRA re-adjusts recent
            # months after field visits, so every station's last three years
            # are read again, as BODC's are. Every station is named, since
            # `all` skips inactive ones and CIMS retires a gauge before its
            # last months reach the export; they cost only reads of the
            # export the run downloads anyway.
            crms)
              which=$(node --input-type=module -e 'import { readStationList } from "./src/store/parquet.ts"; const list = await readStationList(`${process.env.STILLWELL_STORE}/stations/crms.parquet`); if (!list?.length) throw new Error("no CRMS list in the store"); console.log(list.map((s) => s.source_id).join(","))')
              from=$((year - 2)) && set -- "$((year + 1))" --refetch ;;
            *) set -- "$year-$month-01" ;;
          esac
          node scripts/ingest.ts backfill "$SOURCE" "$which" "$from" "$@"
          exit "${status:-0}"
        env:
          SOURCE: ${{ matrix.source }}
          STILLWELL_STORE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}

  # The cross-station checks (scripts/cross-check.ts) over each region's year
  # so far and the five before: months one gauge holds another's data, clock errors and level
  # steps that QC of one station at a time misses. Each region's report is in
  # the job summary and an artifact, for a person to read and turn into errata
  # (CONTRIBUTING.md). It reads the public bucket and changes nothing, so it
  # needs no store credentials or group. Only a full refresh runs it, once the
  # station lists are published.
  cross-check:
    needs: [plan, publish]
    if: ${{ always() && needs.plan.result == 'success' && needs.publish.result == 'success' && needs.plan.outputs.sources != '[]' && !inputs.sources }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: German Bight
            box: 53.2,6.5,55.3,9.2
            sources: pegelonline,gesla
          - region: US East Coast
            box: 30,-82,45.5,-66
            sources: coops,gesla
          - region: Sweden
            box: 55,10.5,66,24.5
            sources: smhi,gesla
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      - run: |
          year=$(date -u +%Y)
          node scripts/cross-check.ts "$BOX" $((year - 5)) $((year + 1)) "$SOURCES" > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
        env:
          BOX: ${{ matrix.box }}
          SOURCES: ${{ matrix.sources }}
      - uses: actions/upload-artifact@v7
        with:
          name: cross-check ${{ matrix.region }}
          path: report.md

  # GitHub disables a public repo's scheduled workflows after 60 days without
  # a commit. Enabling a workflow through the API restarts that count, as the
  # keepalive-workflow action relies on, so this monthly call keeps every
  # schedule running, this one included, with no commits. One a maintainer
  # turned off stays off. It needs no store credentials or concurrency group.
  # It runs on every run titled Monthly, scheduled or dispatched.
  keepalive:
    if: github.event.schedule == '30 1 2 * *' || (github.event_name == 'workflow_dispatch' && !inputs.sources && !inputs.refetch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: |
          # Monthly first, since it enables the rest; one failure doesn't stop the others.
          failed=0
          for workflow in monthly.yml ingest-hourly.yml compact-daily.yml bucket-check.yml canary.yml; do
            if ! state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq .state); then
              failed=1
            elif [ "$state" = disabled_manually ]; then
              echo "$workflow was turned off by hand; leaving it"
            elif ! gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"; then
              failed=1
            fi
          done
          exit "$failed"
        env:
          GH_TOKEN: ${{ github.token }}
