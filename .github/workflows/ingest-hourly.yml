name: Ingest hourly

# Merge the last hours from every live station into recent/<source>.parquet on
# R2. Each source is its own job, so a slow or failing source never holds up
# the others.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recent:
    strategy:
      fail-fast: false
      matrix:
        # BSH publishes predictions only, so it has no live stations.
        source: [coops, pegelonline, rws, usace, usgs]
    # The source's one group for every job that writes its files, manual
    # Ingest runs included, so no two rewrite one file at once.
    concurrency:
      group: lake-${{ matrix.source }}
      cancel-in-progress: false
    # The lake environment only deploys from main; this stops a run from another
    # branch before it waits on that rule.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Stopped before the next hour's run is due.
    timeout-minutes: 50
    # The environment holds the R2 credentials and only runs on main.
    environment: lake
    permissions:
      contents: read
      # To start the Monthly workflow's refresh of this source.
      actions: write
    steps:
      # The token can start workflows, so only the dispatch step gets it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      # Twelve hours covers values that arrive late, and hours skipped while a
      # manual run holds the source's group; a station fetched on its own also
      # looks back two of its intervals, for daily gauges.
      - id: recent
        run: node scripts/ingest.ts recent "$SOURCE" --hours 12
        env:
          SOURCE: ${{ matrix.source }}
          WATER_LEVELS_LAKE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
      # A station the source now reports in another datum fails until a station
      # refresh opens its epoch, or holds it for a person, after which recent
      # skips it. One refresh a day, not counting one that was cancelled, such
      # as one queued behind a long backfill. Failing to start one doesn't fail
      # the hourly run, which wrote what it fetched.
      - if: ${{ !cancelled() && steps.recent.outputs.datum_changed == 'true' }}
        continue-on-error: true
        run: |
          since=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          started=$(gh run list --workflow monthly.yml --event workflow_dispatch --created ">=$since" --json displayTitle,conclusion --jq '.[] | select(.conclusion != "cancelled") | .displayTitle')
          if grep -qx "Refresh $SOURCE" <<< "$started"; then
            echo "A refresh of $SOURCE started in the last day"
          else
            gh workflow run monthly.yml --ref "$GITHUB_REF_NAME" -f sources="$SOURCE"
          fi
        env:
          SOURCE: ${{ matrix.source }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
