name: Ingest hourly

# Merge the last hours from every live station into recent/<source>.parquet on
# R2. Each source is its own job and concurrency group, so a slow or failing
# source never holds up the others, and two runs never write one file at once.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recent:
    strategy:
      fail-fast: false
      matrix:
        # BSH publishes predictions only, so it has no live stations.
        source: [coops, pegelonline, rws, usace, usgs]
    concurrency:
      group: recent-${{ matrix.source }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Stopped before the next hour's run is due.
    timeout-minutes: 50
    # The environment holds the R2 credentials and only runs on main.
    environment: lake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      # Six hours covers values that arrive late and a few missed runs; the
      # window keeps what it had for anything older.
      - run: node scripts/ingest.ts recent "$SOURCE" --hours 6
        env:
          SOURCE: ${{ matrix.source }}
          WATER_LEVELS_LAKE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
