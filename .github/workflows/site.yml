name: Site

# Build the site in site/ and deploy it to GitHub Pages. The build runs the docs' result tables against the public
# store and fails where a query breaks or a reference page's columns and the live files disagree. Before it, the
# report scripts write the TICON inventory and GESLA coverage, which the site's report pages show. Pull requests that
# change the site only build it. Pushes to main deploy it, and so does a daily run, which picks up the store's own
# changes. Monthly keeps the schedule enabled.
on:
  pull_request:
    paths:
      - "site/**"
      - ".mise.toml"
      - ".github/workflows/site.yml"
      # Source pages render each adapter's README.
      - "src/sources/*/README.md"
      - "scripts/ticon-inventory.ts"
      - "scripts/gesla-coverage.ts"
      - "src/ticon.ts"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".mise.toml"
      - ".github/workflows/site.yml"
      # Source pages render each adapter's README.
      - "src/sources/*/README.md"
      - "scripts/ticon-inventory.ts"
      - "scripts/gesla-coverage.ts"
      - "src/ticon.ts"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Runs on main, the ones that deploy, go one at a time in the order they start, so a run that starts later deploys
# later; a newer run replaces one still waiting. Re-running an older run deploys it again. Every other ref has its own group, where a newer run cancels
# an older one.
concurrency:
  group: site-${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'deploy' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Check the lockfile regenerates from package.json
        run: |
          git ls-files --error-unmatch package-lock.json
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
      - name: Check every package resolves from the npm registry
        run: npx -y lockfile-lint@5.1.0 --path package-lock.json --allowed-hosts npm --validate-https --validate-integrity --validate-package-names
      - run: npm ci
      # The report pages read reports/, which the repository's scripts write from the store and from
      # slackwater-database's TICON records at the version the repository installs. A report that fails, or a step it
      # needs, leaves its page saying so rather than stop the deploy; a pull request fails instead. CI's reports job
      # runs both scripts on every pull request, whichever files it touches.
      - name: Install the repository's packages for the reports
        working-directory: .
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: npm ci
      - id: tide
        working-directory: .
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: echo "version=$(node -p "require('./node_modules/@slackwater/database/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        with:
          repository: openwatersio/slackwater-database
          ref: v${{ steps.tide.outputs.version }}
          path: slackwater-database
      # Each report has its own limit, so one that hangs fails like any other rather than run out the job's.
      - name: Write the TICON inventory
        working-directory: .
        timeout-minutes: 8
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: npm run ticon:inventory
        env:
          TIDE_DATABASE: slackwater-database
      - name: Write the GESLA coverage
        working-directory: .
        timeout-minutes: 8
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: npm run gesla:coverage
      # The deployed site has no station pages. A pull request builds two small sources' pages, to render the
      # station page and bundle its chart: BSH's stations have predictions and no observations, and every Marine
      # Institute station has errata.
      - run: npm run build
        env:
          STATIONS: ${{ github.event_name == 'pull_request' && 'bsh,marine-institute' || '' }}
      # Pages serves the site under /stillwell, so a root path in any HTML attribute needs it, once.
      - name: Check every root path in the HTML carries the base path
        run: |
          if grep -rhoE "[a-z-]+=[\"']/[^\"']*" dist --include='*.html' | grep -vE "=[\"'](/stillwell([/#?]|$)|//)" | sort -u | head -20 | grep .; then
            exit 1
          fi
          if grep -rlE '/stillwell/stillwell([/"#?]|$)' dist --include='*.html' | head -5 | grep .; then
            exit 1
          fi
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
