name: Compact daily

# Fold the whole days in recent/<source>.parquet into each station's year file
# under obs/ on R2. Each year file is read, merged and written whole, so a
# failed run leaves the file it had, and a rerun writes nothing new. Then it
# writes each station's first and last level, and its earliest preliminary
# value, to stations/bounds/<source>.parquet.
on:
  schedule:
    # Between hourly runs; the fold covers six days, so a late hourly run, or
    # a missed compaction, is caught up the next night.
    - cron: "45 0 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Whole UTC days to fold, ending yesterday (up to 6)"
        required: true
        default: "6"

permissions:
  contents: read

jobs:
  # The Worker in workers/cron dispatches this workflow, since GitHub's
  # schedule runs late or not at all. The schedule is a backup, skipped when a
  # dispatched run on main started in the last 23 hours: a second run would wait in each
  # source's group, and cancel any job already waiting there, such as a
  # compaction or a station refresh. A dispatched run counts even when one of
  # its jobs was cancelled while waiting, since a backup would cancel whatever
  # replaced it. A failed lookup runs the backup.
  gate:
    # The lake environment only deploys from main; this stops a run from another
    # branch before it waits on that rule.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        run: |
          run=true
          # A re-run of every job is someone asking for this run, so it runs.
          if [ "$EVENT" = schedule ] && [ "$ATTEMPT" = 1 ]; then
            since=$(date -u -d '23 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            if dispatched=$(gh run list --workflow compact-daily.yml --branch main --event workflow_dispatch --created ">=$since" --json databaseId --jq '.[].databaseId') && [ -n "$dispatched" ]; then
              echo "A dispatched run started in the last 23 hours"
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  compact:
    strategy:
      fail-fast: false
      matrix:
        source: [coops, pegelonline, rws, uhslc, usace, usgs]
    # The source's one group for every job that writes its files, manual
    # Ingest runs included, so a compaction never reads recent/ while the hourly
    # run replaces it, or rewrites a year file a backfill is writing.
    concurrency:
      # A backup the gate skipped names a group of its own, so its skipped jobs
      # can't touch a job waiting in the source's.
      group: ${{ needs.gate.outputs.run == 'true' && format('lake-{0}', matrix.source) || format('skipped-{0}', github.run_id) }}
      cancel-in-progress: false
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # The environment holds the R2 credentials and only runs on main.
    environment: lake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      # Every whole day the window holds, not just yesterday, so late values,
      # QC flags the window revised and missed runs still reach the year file.
      # It costs no extra writes: a station's days share one year file except
      # in the first week of January, and a file the fold doesn't change isn't
      # written.
      - run: node scripts/ingest.ts compact "$SOURCE" --days "$DAYS" --concurrency 16
        env:
          SOURCE: ${{ matrix.source }}
          DAYS: ${{ inputs.days || '6' }}
          # Sixteen full-year 1-minute files merge at once, which peaked near
          # 2.5 GB of heap; the runner has 16 GB.
          NODE_OPTIONS: --max-old-space-size=8192
          WATER_LEVELS_LAKE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

  # Opens an issue when a source's job fails in two runs on main in a row,
  # and closes it when the job next succeeds (scripts/alert.sh). Not on a
  # backup the gate skipped, which ran no jobs.
  alert:
    needs: [gate, compact]
    # A re-run would judge a source by an older result than its latest.
    if: always() && needs.gate.outputs.run == 'true' && github.run_attempt == 1
    # One at a time, so two runs' alerts never both open an issue.
    concurrency:
      group: ${{ needs.gate.outputs.run == 'true' && format('alert-{0}', github.workflow) || format('skipped-alert-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - run: scripts/alert.sh compact
        env:
          GH_TOKEN: ${{ github.token }}
