name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      - run: npm run check

  # Runs the report scripts the Site workflow runs before each build, against the public store and slackwater-database
  # at the version the repository installs, so a change that breaks one fails here rather than on main.
  reports:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      - id: tide
        run: echo "version=$(node -p "require('./node_modules/@slackwater/database/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: openwatersio/slackwater-database
          ref: v${{ steps.tide.outputs.version }}
          path: slackwater-database
      - run: npm run ticon:inventory
        env:
          TIDE_DATABASE: slackwater-database
      - run: npm run gesla:coverage

  # Deploys the Workers (workers/) on every push to main, the live Worker's poller image included, once the
  # `cloudflare` environment holds CLOUDFLARE_API_TOKEN and the repository variable CLOUDFLARE_ACCOUNT_ID is set;
  # until then it's skipped and they're deployed by hand (workers/live/README.md).
  deploy:
    needs: [test, lockfile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: cloudflare
    # One at a time, and a newer push waits rather than cancel a deploy partway.
    concurrency:
      group: deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      - run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN isn't set in the cloudflare environment, so nothing deploys"
            exit 0
          fi
          for worker in live api cron; do
            (cd "workers/$worker" && npx wrangler deploy)
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
      - name: Check the lockfile regenerates from package.json
        run: |
          git ls-files --error-unmatch package-lock.json
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
      - name: Check every package resolves from the npm registry
        run: npx -y lockfile-lint@5.1.0 --path package-lock.json --allowed-hosts npm --validate-https --validate-integrity --validate-package-names
