name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # For the realtime store's tests (test/clickhouse.test.ts), which skip without it.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CLICKHOUSE_URL: http://127.0.0.1:8123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      - run: npm run check

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
      - name: Check the lockfile regenerates from package.json
        run: |
          git ls-files --error-unmatch package-lock.json
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
      - name: Check every package resolves from the npm registry
        run: npx -y lockfile-lint@5.1.0 --path package-lock.json --allowed-hosts npm --validate-https --validate-integrity --validate-package-names
