name: Ingest

# Run any ingest command against the R2 lake by hand, e.g.
# `backfill rws hoekvanholland 2024 2025`. Ingest hourly and Compact daily run
# `recent` and `compact` on a schedule.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "ingest.ts arguments"
        required: true
        default: "stations"
      timeout:
        description: "Minutes before the job is stopped (up to 360)"
        required: true
        default: "180"

jobs:
  # A command for one source shares that source's group with the scheduled
  # jobs, so a backfill and a compaction never rewrite one year file at once.
  # `stations` writes only the station lists, and takes the `lake` group.
  group:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      name: ${{ steps.group.outputs.name }}
    steps:
      - id: group
        run: |
          set -f
          set -- $ARGS
          case "$1" in
            backfill | recent | compact) echo "name=lake-$2" >> "$GITHUB_OUTPUT" ;;
            *) echo "name=lake" >> "$GITHUB_OUTPUT" ;;
          esac
        env:
          ARGS: ${{ inputs.args }}

  ingest:
    needs: group
    concurrency:
      group: ${{ needs.group.outputs.name }}
      cancel-in-progress: false
    # The lake environment only deploys from main; this stops a run from another
    # branch before it waits on that rule.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A station refresh takes about an hour, mostly CO-OPS, so 180 minutes stops a
    # stuck run without holding the lake for six hours. Long backfills raise it.
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}
    # The environment holds the R2 credentials and only runs on main.
    environment: lake
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      # The arguments come through the environment, never into the script text.
      - run: |
          set -f
          node scripts/ingest.ts $ARGS
        env:
          ARGS: ${{ inputs.args }}
          WATER_LEVELS_LAKE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          # USGS shares 1,000 requests an hour among keyless clients on one IP.
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
