name: Ingest

# Run any ingest command against the R2 store by hand, e.g.
# `backfill rws hoekvanholland 2024 2025`. Ingest hourly and Compact daily run
# `recent` and `compact` on a schedule.
run-name: Ingest ${{ inputs.args }}
on:
  workflow_dispatch:
    inputs:
      args:
        description: "ingest.ts arguments"
        required: true
        default: "publish"
      timeout:
        description: "Minutes before the job is stopped (up to 360)"
        required: true
        default: "180"

jobs:
  # A command for one source shares that source's group with the scheduled
  # jobs, so a backfill and a compaction never rewrite one year file at once.
  # Station lists are refreshed only by the Monthly workflow, so two refreshes
  # never rewrite one list, nor two publishes stations.parquet. Anything else,
  # `publish` included, takes the `store` group.
  group:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      name: ${{ steps.group.outputs.name }}
    steps:
      - id: group
        run: |
          set -f
          # The command and sources are the words that aren't an option or
          # its value; every ingest option takes a value but --accept-epochs, --accept-withheld, --no-publish,
          # --refetch, --skip-written, --skip-unscreened, --with-inactive, --rebuild-bounds, --rebuild-years, --all and --requalify.
          words=()
          skip=
          for arg in $ARGS; do
            if [ -n "$skip" ]; then skip=; continue; fi
            case "$arg" in
              --accept-epochs | --accept-withheld | --no-publish | --refetch | --skip-written | --skip-unscreened | --with-inactive | --rebuild-bounds | --rebuild-years | --all | --requalify | --*=* | --) ;;
              --*) skip=1 ;;
              *) words+=("$arg") ;;
            esac
          done
          case "${words[0]:-}" in
            backfill | recent | compact | requalify | withhold | years | analyze) [ -n "${words[1]:-}" ] && group="store-${words[1]}" || group=store ;;
            stations)
              echo "::error::Refresh station lists with the Monthly workflow, which runs each source in its own group and then publishes"
              exit 1
              ;;
            *) group=store ;;
          esac
          echo "name=$group" >> "$GITHUB_OUTPUT"
        env:
          ARGS: ${{ inputs.args }}

  ingest:
    needs: group
    concurrency:
      group: ${{ needs.group.outputs.name }}
      cancel-in-progress: false
    # The `lake` environment only deploys from main; this stops a run from another
    # branch before it waits on that rule.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 180 minutes stops a stuck run without holding the store for six hours.
    # Long backfills raise it.
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}
    # The environment holds the R2 credentials and only runs on main.
    environment: lake
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - run: npm ci
      # The arguments come through the environment, never into the script text.
      - run: |
          set -f
          node scripts/ingest.ts $ARGS
        env:
          ARGS: ${{ inputs.args }}
          STILLWELL_STORE: s3://water-levels
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          # USGS shares 1,000 requests an hour among keyless clients on one IP.
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
